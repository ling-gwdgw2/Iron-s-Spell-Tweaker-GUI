plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_name}-NeoForge-${minecraft_version}"
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':common')

    compileOnly files("${rootProject.projectDir}/libs/irons_spellbooks-1.21.1-3.16.2.jar")
    compileOnly files("${rootProject.projectDir}/libs/irons_lib-1.21.1-2.1.0.jar")
    compileOnly files("${rootProject.projectDir}/libs/yet_another_config_lib_v3-3.8.2+1.21.1-neoforge.jar")

    localRuntime files("${rootProject.projectDir}/libs/irons_spellbooks-1.21.1-3.16.2.jar")
    localRuntime files("${rootProject.projectDir}/libs/irons_lib-1.21.1-2.1.0.jar")
    localRuntime files("${rootProject.projectDir}/libs/yet_another_config_lib_v3-3.8.2+1.21.1-neoforge.jar")
}

tasks.named('jar', Jar) {
    from project(':common').sourceSets.main.output
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/resources/META-INF/neoforge.mods.toml"
    into "build/generated/sources/modMetadata/META-INF"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
