plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${mod_name}-Fabric-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    implementation project(':common')

    compileOnly files("${rootProject.projectDir}/libs/irons_spellbooks-1.21.1-3.16.2.jar")
    compileOnly files("${rootProject.projectDir}/libs/irons_lib-1.21.1-2.1.0.jar")
    compileOnly files("${rootProject.projectDir}/libs/yet_another_config_lib_v3-3.8.2+1.21.1-neoforge.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.fabric_loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.fabric_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    sourceSets.main.compileClasspath += project(':common').sourceSets.main.output
}

tasks.named('jar', Jar) {
    from project(':common').sourceSets.main.output
}

tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask) {
    from project(':common').sourceSets.main.output
}
